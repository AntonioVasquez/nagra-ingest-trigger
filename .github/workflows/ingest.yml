name: Ingesta cada 12h

on:
  schedule:
    # UTC. 00/12h UTC ≈ 20/08h Chile continental (varía con horario de verano).
    - cron: "0 */12 * * *"
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

# Evita que dos corridas anden pisándose si alguna vez una se alarga tanto
# que se cruza con el siguiente disparo del cron -- no debería pasar con el
# margen de abajo, pero si el catálogo crece y vuelve a pasar, esto hace que
# la nueva espere a que la anterior termine en vez de competir por la misma
# base al mismo tiempo.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 53 adaptadores (antes de Sodimac) tardaban 30-44 min. Los 17 de
    # Sodimac lo subieron a ~61-62 min -- 90 deja margen real, no solo lo
    # justo. Este repo no tiene el código del scraper ni de la API: solo
    # dispara la ingesta que corre en Render, vía HTTP, con el secret de
    # abajo.
    timeout-minutes: 90
    steps:
      # Una request síncrona por tienda/categoría en vez de una sola que
      # dispara todo en background -- el plan Free de Render suspende el
      # proceso poco después de que la request que lo despertó termina, así
      # que una corrida completa en background casi nunca llegaba a las
      # últimas tiendas de la lista.
      - name: Ingesta troceada por adaptador
        run: |
          set -uo pipefail
          BASE="${{ secrets.API_URL }}"
          AUTH="Authorization: Bearer ${{ secrets.INGEST_TRIGGER_SECRET }}"

          # El free tier puede estar dormido -- dar tiempo/reintentos solo acá.
          COUNT=$(curl --fail --retry 5 --retry-delay 10 --max-time 60 -s "$BASE/internal/ingest/meta" -H "$AUTH" | jq -r '.count')
          echo "Adaptadores configurados: $COUNT"

          fallos=0
          for i in $(seq 0 $((COUNT - 1))); do
            # GitHub Actions corre este script con `bash -e`: si no se neutraliza
            # el exit status de curl acá, un solo fallo de red (no solo un HTTP
            # de error) mata TODO el loop de golpe en vez de solo contarse y
            # seguir con el resto.
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 180 --retry 2 --retry-delay 5 \
              -X POST "$BASE/internal/ingest?index=$i" -H "$AUTH") || code="curl_error"
            echo "chunk $i/$COUNT -> HTTP $code"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              fallos=$((fallos + 1))
            fi
          done

          echo "Terminado. $fallos/$COUNT chunks fallaron."
          # No hace fail el job por chunks sueltos que fallan (un adaptador caído
          # no debe tumbar el resto) -- solo si TODOS fallaron, algo más grave pasa.
          if [ "$fallos" -eq "$COUNT" ]; then
            echo "::error::Todos los chunks fallaron"
            exit 1
          fi
